name: MealPlannerApi CI

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
    dotnet-version: "9.0.x"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal

  release:
    needs: build      
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET 
        uses: actions/setup-dotnet@v6
        with:
            dotnet-version: ${{ env.dotnet-version }}
      
      - name: Publish
        run: dotnet publish MealPlannerApi/MealPlannerApi.csproj -c Release --runtime linux-x64 -p:Version=${GITHUB_REF_NAME#v} -o "./publish"

      - name: Upload to Cloudflare R2
        uses: ryand56/r2-upload-action@5947cd194791163d9b3083371bd621f53e415959
        with: 
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: ./publish
          destination-dir: ./releases/${{ github.ref_name }}
        

  
          
