name: MealPlannerApi CI

on:
  pull_request:
  push:
    branches: ["master"]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  dotnet-version: "9.0.x"
  publish-dir: "./publish"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal

    - name: Publish
      run: dotnet publish MealPlannerApi/MealPlannerApi.csproj -c Release --runtime linux-x64

  release:
    needs: build      
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET 
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.dotnet-version }}
      
      - name: Publish
        run: dotnet publish MealPlannerApi/MealPlannerApi.csproj -c Release --runtime linux-x64 -p:Version=${GITHUB_REF_NAME#v} -o "${{ env.publish-dir }}"

      - name: Compress
        run: tar -czf ${{ github.ref_name }}.tar.gz ${{ env.publish-dir }}

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: >
          aws s3 cp ${{ github.ref_name }}.tar.gz
          s3://${{ secrets.R2_BUCKET }}/releases/${{ github.ref_name }}/${{ github.ref_name }}.tar.gz
          --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
